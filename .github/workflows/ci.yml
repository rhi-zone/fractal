name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: the comment-approval
          # check (below) diffs against the PR base / pre-push commit to find
          # which files this change touches, which needs that commit to
          # actually be present locally.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install dependencies
        run: nix develop --command bun install

      - name: Format check
        run: nix develop --command bun run format:check

      - name: Lint
        run: nix develop --command bun run lint

      - name: Typecheck
        run: nix develop --command bun run typecheck

      - name: Test
        run: nix develop --command bun run test

      # tooling/comment-approval isn't a workspace package (it's repo
      # infra, like tooling/check-workspace.sh — see its own README for
      # why), so `bun run typecheck`/`bun run test`'s --filter '*' above
      # don't reach it.
      - name: Typecheck comment-approval tool
        run: nix develop --command ./node_modules/.bin/tsc --noEmit -p tooling/comment-approval/tsconfig.json

      - name: Test comment-approval tool
        run: nix develop --command bun test tooling/comment-approval

      # Gate on comments in files this push/PR actually touches, not the
      # whole repo — see tooling/comment-approval/README.md's bootstrap
      # section for why the pre-existing backlog starts unapproved rather
      # than bulk-approved, and .githooks/pre-commit's own comment for why
      # this mirrors that hook's file-scoped (not whole-repo) semantics.
      - name: Determine comment-approval diff base
        id: comment_approval_base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # First push creating a branch (no prior commit to diff against)
            # — nothing meaningful to scope the check to; skip rather than
            # guess.
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check comment approvals
        if: steps.comment_approval_base.outputs.sha != ''
        run: nix develop --command bun tooling/comment-approval/cli.ts check --diff-base ${{ steps.comment_approval_base.outputs.sha }}

      # compile-check.test.ts (part of the type-ir package, already covered by
      # `bun run test` above) shells out to each target language's real
      # compiler/checker — tsc, go, cargo, swiftc, ghc, dotnet, g++, crystal,
      # ruby, php, protoc, capnp, flatc, clang+GNUstep, flow — to verify the
      # generated code actually compiles, not just that it string-matches.
      # Broken out as its own named step (even though `bun run test` already
      # runs it) so a real-compiler regression shows up distinctly in CI
      # rather than buried in the general test step's output; it needs the
      # full nix devShell for every one of those toolchains (see flake.nix)
      # plus network access (cargo/rustc resolves serde+serde_json from
      # crates.io; nix eval looks up nlohmann_json's store path).
      - name: Compile-check generated code
        run: nix develop --command bun test src/compile-check.test.ts
        working-directory: packages/type-ir

      - name: Build playground
        run: nix develop --command bun run build
        working-directory: packages/playground

  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install dependencies
        run: nix develop --command bun install

      # Builds the 8 publishable packages (api-tree, type-ir, and the five
      # projectors + auth-oidc) via `tsc -b tsconfig.build.json`'s project
      # references, producing real dist/ (.js + .d.ts) output mirroring each
      # package's src/ 1:1 — the artifacts an eventual `npm publish` would
      # ship. Verify-only: this never calls `npm publish` (that's still
      # hard-blocked pending manual owner approval, see TODO.md). Runs
      # against each package's *committed* package.json (still pointing at
      # ./src/*.ts for the source-to-source bun-workspace dev path used
      # elsewhere in this workflow) — build:packages only needs the
      # tsconfig.build.json project-reference graph, not a package.json
      # exports rewrite, to prove the dist output itself compiles cleanly.
      - name: Build packages (dist)
        run: nix develop --command bun run build:packages
